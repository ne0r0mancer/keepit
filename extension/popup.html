<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 13px;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }
    label {
      display: block;
      margin-bottom: 4px;
      color: #999;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 12px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #252525;
      color: #e0e0e0;
      font-size: 13px;
    }
    input:focus {
      outline: none;
      border-color: #4a9eff;
    }
    input::placeholder { color: #666; }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: #4a9eff;
      color: #fff;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    #status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    #status.error { display: block; background: #3d1a1a; color: #f87171; }
    .hint {
      margin-top: 12px;
      font-size: 11px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>KeepIt Settings</h1>
  
  <label for="server">Server URL</label>
  <input type="url" id="server" placeholder="http://localhost:8000">
  
  <label for="token">Auth Token</label>
  <input type="password" id="token" placeholder="your-secret-token">
  
  <button id="save">Save & Close</button>
  
  <div id="status"></div>
  <p class="hint">After saving, click the icon to clip pages</p>
  
  <script src="popup.js"></script>
</body>
</html>
