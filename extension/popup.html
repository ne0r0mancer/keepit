<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, system-ui, sans-serif;
      font-size: 13px;
      background: #1a1a1a;
      color: #e0e0e0;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }
    label {
      display: block;
      margin-bottom: 4px;
      color: #999;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 12px;
      border: 1px solid #333;
      border-radius: 4px;
      background: #252525;
      color: #e0e0e0;
      font-size: 13px;
    }
    input:focus {
      outline: none;
      border-color: #4a9eff;
    }
    input::placeholder { color: #666; }
    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #save-settings {
      background: #333;
      color: #e0e0e0;
    }
    #clip-page {
      background: #4a9eff;
      color: #fff;
    }
    #status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
      display: none;
    }
    #status.success { display: block; background: #1a3d1a; color: #4ade80; }
    #status.error { display: block; background: #3d1a1a; color: #f87171; }
  </style>
</head>
<body>
  <h1>KeepIt</h1>
  
  <label for="server">Server URL</label>
  <input type="url" id="server" placeholder="http://localhost:8000">
  
  <label for="token">Auth Token</label>
  <input type="password" id="token" placeholder="your-secret-token">
  
  <div class="buttons">
    <button id="save-settings">Save</button>
    <button id="clip-page">Clip Page</button>
  </div>
  
  <div id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
